name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*a*"
      - "v*.*.*b*"
      - "v*.*.*rc*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      package_version: ${{ steps.meta.outputs.package_version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Derive release metadata from tag
        id: meta
        shell: bash
        run: |
          package_version="${GITHUB_REF_NAME#v}"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

          if [[ "$package_version" == *a* || "$package_version" == *b* || "$package_version" == *rc* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate tag matches package version
        shell: bash
        run: |
            python - <<'PY'
            from pathlib import Path
            import re
            import tomllib

            expected = "${{ steps.meta.outputs.package_version }}"
            pyproject_version = tomllib.loads(
                Path("pyproject.toml").read_text(encoding="utf-8")
            )["project"]["version"]

            init_text = Path("seavision/__init__.py").read_text(encoding="utf-8")
            match = re.search(
                r'^__version__\s*=\s*"([^"]+)"',
                init_text,
                re.MULTILINE,
            )
            if not match:
                raise SystemExit("Could not find __version__ in seavision/__init__.py")

            init_version = match.group(1)

            if expected != pyproject_version or expected != init_version:
                raise SystemExit(
                    "Tag/package version mismatch: "
                    f"tag={expected}, pyproject={pyproject_version}, __init__={init_version}"
                )

            print(f"Validated release version {expected}")
            PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build distributions
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Generate SHA256SUMS.txt
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          dist_dir = Path("dist")
          lines = []

          for path in sorted(dist_dir.iterdir()):
              if not path.is_file():
                  continue

              digest = hashlib.sha256()
              with open(path, "rb") as file_obj:
                  for chunk in iter(lambda: file_obj.read(8192), b""):
                      digest.update(chunk)

              lines.append(f"{digest.hexdigest()} *{path.name}")

          (dist_dir / "SHA256SUMS.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("Wrote dist/SHA256SUMS.txt")
          PY

      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  smoke:
    needs: build
    runs-on: ${{ matrix.os }}
    defaults:
        run:
            shell: bash

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.12"
        persona:
          - core
          - gui
          - edge
          - export
          - all

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Install wheel for persona
        env:
          PERSONA: ${{ matrix.persona }}
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          extras = {
              "core": "",
              "gui": "[gui]",
              "edge": "[edge]",
              "export": "[export]",
              "all": "[all]",
          }

          wheels = sorted(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected exactly one wheel in dist/, found: {wheels}")
          wheel_uri = wheels[0].resolve().as_uri()

          spec = f"seavision-python{extras[os.environ['PERSONA']]} @ {wheel_uri}"

          print(f"Installing {spec}")
          subprocess.check_call([sys.executable, "-m", "pip", "install", spec])
          PY

      - name: Run persona smoke test
        env:
          PERSONA: ${{ matrix.persona }}
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          persona = os.environ["PERSONA"]

          def run(*cmd):
              print("Running:", " ".join(cmd))
              subprocess.check_call(list(cmd))

          if persona == "core":
              run("seavision", "--help")
          elif persona == "gui":
              run(sys.executable, "-c", "from seavision.gui.main_window import MainWindow; print('GUI import ok')")
          elif persona == "edge":
              run("seavision-edge", "--help")
          elif persona == "export":
              run("seavision-export", "--help")
          elif persona == "all":
              run("seavision", "--help")
              run(sys.executable, "-c", "from seavision.gui.main_window import MainWindow; print('GUI import ok')")
              run("seavision-export", "--help")
              run("seavision-edge", "--help")
              run(sys.executable, "-c", "import seavision; print(seavision.__version__)")
          else:
              raise SystemExit(f"Unknown persona: {persona}")
          PY


  pytest:
    needs: build
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Install pytest and wheel under test
        shell: bash
        run: |
          python -m pip install --upgrade pip pytest pytest-cov
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          wheels = sorted(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected exactly one wheel in dist/, found: {wheels}")
          wheel_uri = wheels[0].resolve().as_uri()
          spec = f"seavision-python[gui,edge] @ {wheel_uri}"

          print(f"Installing {spec}")
          subprocess.check_call([sys.executable, "-m", "pip", "install", spec])
          PY

      - name: Run pytest against installed wheel
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          python -m pytest \
            "$GITHUB_WORKSPACE/tests/edge" \
            "$GITHUB_WORKSPACE/tests/gui" \
            -q -ra


  github_release:
    needs:
      - build
      - smoke
      - pytest
    runs-on: ubuntu-latest

    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          files: |
            dist/*
          generate_release_notes: true

  publish_testpypi:
    if: needs.build.outputs.prerelease == 'true'
    needs:
      - build
      - smoke
      - pytest
    runs-on: ubuntu-latest
    environment: testpypi

    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

  publish_pypi:
    if: needs.build.outputs.prerelease == 'false'
    needs:
      - build
      - smoke
      - pytest
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

